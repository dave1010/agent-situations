name: node-package-manager-lockfile
description: Guides lockfile usage when multiple Node.js package managers are present.

check:
  type: file-exists
  paths:
    - pnpm-lock.yaml
    - yarn.lock
    - package-lock.json
    - bun.lockb

context:
  type: static
  text: |
    Node.js package manager lockfile detected.
    - Use the CLI that matches the highest-priority lockfile present:
      1) pnpm-lock.yaml → pnpm
      2) yarn.lock → yarn
      3) package-lock.json → npm
      4) bun.lockb → bun
    - Do not edit or regenerate lower-priority lockfiles; only update the primary lockfile for this repo.
